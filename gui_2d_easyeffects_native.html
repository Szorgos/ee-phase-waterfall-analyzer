<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyEffects Natív Stílusú Fázis és Késleltetés EQ Analizátor</title>
<style>
  /* EASYFFECTS & GNOME LIBADWAITA NATÍV SÖTÉT SZÍNPALETTA */
  :root {
    --ee-window-bg: #242424;     /* GNOME Adwaita sötét ablak háttér */
    --ee-view-bg: #1e1e1e;       /* Mélyített rajzterület */
    --ee-card-bg: #303030;       /* GNOME Adwaita kártya háttér */
    --ee-card-hover: #383838;
    --ee-border: #3c3c3c;        /* Vékony Adwaita szegély */
    --ee-border-active: #505050;
    
    /* EasyEffects jellegzetes színei */
    --ee-accent-blue: #3584e4;   /* GNOME / EasyEffects Kék (Alapértelmezett) */
    --ee-curve-primary: #78aeed; /* EasyEffects EQ Görbe világoskék */
    --ee-delay-orange: #ff7800;  /* Késleltetés / Figyelmeztetés */
    --ee-phase-green: #33d17a;   /* Fázisszög zöld */
    --ee-destructive: #e01b24;   /* Törlés piros */
    
    --ee-text-primary: #ffffff;
    --ee-text-secondary: #9a9996;/* Adwaita tompa szürke */
    --ee-grid: #2c2c2c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Cantarell", "Segoe UI", Roboto, sans-serif; }
  body { background: var(--ee-window-bg); color: var(--ee-text-primary); padding: 14px; user-select: none; }
  .container { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

  /* ADWAITA STÍLUSÚ FEJLÉC (HEADERBAR) */
  header { background: var(--ee-card-bg); border: 1px solid var(--ee-border); border-radius: 9px; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .app-icon { width: 28px; height: 28px; border-radius: 6px; background: var(--ee-accent-blue); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.85rem; }
  h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.2px; }
  h1 span { font-weight: 400; color: var(--ee-text-secondary); font-size: 0.95rem; }

  /* FŐ GRAFIKUS TÉR */
  .viewport-wrapper { position: relative; background: var(--ee-view-bg); border: 1px solid var(--ee-border); border-radius: 9px; overflow: hidden; }
  canvas#eqCanvas { display: block; width: 100%; height: 440px; cursor: crosshair; }

  /* LEBEGŐ REFERENCIA SÁV */
  .hud-strip { position: absolute; top: 10px; right: 12px; background: rgba(36, 36, 36, 0.92); border: 1px solid var(--ee-border); border-radius: 6px; padding: 6px 12px; font-size: 0.75rem; display: flex; gap: 14px; pointer-events: none; }
  .hud-val { color: #fff; font-family: monospace; font-weight: 600; }

  /* ALSÓ VEZÉRLŐSÁV */
  .bottom-bar { background: var(--ee-card-bg); border: 1px solid var(--ee-border); border-radius: 9px; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; }
  
  .node-readout { display: flex; align-items: center; gap: 18px; font-size: 0.85rem; }
  .stat-group { display: flex; gap: 6px; align-items: baseline; }
  .stat-group span.lbl { color: var(--ee-text-secondary); font-size: 0.75rem; }
  .stat-group span.num { color: #fff; font-family: monospace; font-weight: 600; font-size: 0.95rem; }

  .actions-group { display: flex; gap: 8px; align-items: center; }

  /* GNOME ADWAITA NUMERIKUS INPUTOK ÉS SELECT */
  .ee-input { background: #1e1e1e; border: 1px solid var(--ee-border); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; font-family: monospace; font-weight: 600; text-align: left; outline: none; transition: border-color 0.15s; }
  .ee-input:focus { border-color: var(--ee-accent-blue); box-shadow: 0 0 0 1px var(--ee-accent-blue); }
  .ee-select { background: #1e1e1e; border: 1px solid var(--ee-border); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; outline: none; cursor: pointer; }
  .ee-select:focus { border-color: var(--ee-accent-blue); }
  .unit { font-size: 0.75rem; color: var(--ee-text-secondary); margin-left: 3px; }

  /* ADWAITA GOMBOK */
  .adw-btn { background: #383838; border: 1px solid var(--ee-border); color: #fff; padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: 500; transition: all 0.15s ease; display: flex; align-items: center; gap: 6px; }
  .adw-btn:hover { background: #424242; border-color: var(--ee-border-active); }
  .adw-btn.primary { background: var(--ee-accent-blue); border-color: var(--ee-accent-blue); font-weight: 600; }
  .adw-btn.primary:hover { background: #4a90e2; }
  .adw-btn.danger { color: #ff7b80; }
  .adw-btn.danger:hover { background: rgba(224, 27, 36, 0.2); border-color: var(--ee-destructive); }

  .adw-btn.active-curve { background: rgba(120, 174, 237, 0.15); border-color: var(--ee-curve-primary); color: var(--ee-curve-primary); font-weight: 600; }
  .adw-btn.active-delay { background: rgba(255, 120, 0, 0.15); border-color: var(--ee-delay-orange); color: var(--ee-delay-orange); font-weight: 600; }
  .adw-btn.active-phase { background: rgba(51, 209, 122, 0.15); border-color: var(--ee-phase-green); color: var(--ee-phase-green); font-weight: 600; }

  .live-pill { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--ee-text-secondary); background: #2a2a2a; padding: 4px 10px; border-radius: 4px; border: 1px solid var(--ee-border); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ee-phase-green); }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-left">
      <div class="app-icon">EE</div>
      <h1>EasyEffects <span>• Equalizer & Fázis Analizátor</span></h1>
    </div>
    <div class="live-pill">
      <div class="dot"></div>
      <span>PipeWire DSP Csatolás: Valós Idejű Paraméterek</span>
    </div>
  </header>

  <div class="viewport-wrapper">
    <canvas id="eqCanvas"></canvas>

    <div class="hud-strip">
      <div>Freq: <span class="hud-val" id="hudFreq">1000 Hz</span></div>
      <div>Erősítés: <span class="hud-val" id="hudGain" style="color:var(--ee-curve-primary);">0.0 dB</span></div>
      <div>Késleltetés: <span class="hud-val" id="hudDelay" style="color:var(--ee-delay-orange);">0.00 ms</span></div>
      <div>Fázis: <span class="hud-val" id="hudPhase" style="color:var(--ee-phase-green);">0.0°</span></div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="node-readout">
      <div style="font-weight:700;" id="selectedNodeTitle">Sáv #1</div>

      <div class="stat-group">
        <label class="lbl" for="selectType">Típus:</label>
        <select id="selectType" class="ee-select">
          <option value="peaking">Harang (Peaking)</option>
          <option value="lowshelf">Mély kiemelés (Low Shelf)</option>
          <option value="highshelf">Magas kiemelés (High Shelf)</option>
          <option value="lowpass">Mélyáteresztő (Low Pass)</option>
          <option value="highpass">Felüláteresztő (High Pass)</option>
        </select>
      </div>
      
      <div class="stat-group">
        <label class="lbl" for="inputFreq">Frekvencia:</label>
        <input type="number" id="inputFreq" min="20" max="20000" step="1" class="ee-input" style="width:72px;">
        <span class="unit">Hz</span>
      </div>

      <div class="stat-group">
        <label class="lbl" for="inputGain">Erősítés:</label>
        <input type="number" id="inputGain" min="-24" max="24" step="0.1" class="ee-input" style="width:62px; color:var(--ee-curve-primary);">
        <span class="unit">dB</span>
      </div>

      <div class="stat-group">
        <label class="lbl" for="inputQ">Q-faktor:</label>
        <input type="number" id="inputQ" min="0.1" max="15" step="0.05" class="ee-input" style="width:62px;">
      </div>
      
      <button class="adw-btn danger" id="btnDeleteNode" title="Kijelölt sáv törlése">✕ Törlés</button>
    </div>

    <div class="actions-group">
      <!-- ÚJ PONT HOZZÁADÁSA GOMB -->
      <button class="adw-btn primary" id="btnAddNode">+ Új EQ Sáv</button>

      <!-- MEGJELENÍTÉSI KAPCSOLÓK -->
      <button class="adw-btn active-curve" id="btnCurve">Amplitúdó (dB)</button>
      <button class="adw-btn active-delay" id="btnDelay">Csoportkésleltetés (ms)</button>
      <button class="adw-btn active-phase" id="btnPhase">Fázisszög (°)</button>
    </div>
  </div>
</div>

<script>
// EasyEffects színpalettájú sávok
let nodes = [
  { id: 1, freq: 60, gain: 6.0, q: 1.41, type: "peaking", color: "#3584e4" },
  { id: 2, freq: 120, gain: -8.0, q: 4.5, type: "peaking", color: "#e01b24" },
  { id: 3, freq: 2400, gain: -2.0, q: 2.0, type: "peaking", color: "#ff7800" },
  { id: 4, freq: 9000, gain: 3.5, q: 0.71, type: "highshelf", color: "#33d17a" }
];

let selectedNodeId = 1;
let draggedNode = null;

let showCurve = true;
let showDelay = true;
let showPhase = true;

const canvas = document.getElementById("eqCanvas");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = canvas.clientWidth * window.devicePixelRatio;
  canvas.height = canvas.clientHeight * window.devicePixelRatio;
  draw();
}
window.addEventListener("resize", resize);

// Biquad Matematika
function evalBiquad(flt, f, sr = 48000) {
  const w0 = 2 * Math.PI * flt.freq / sr;
  const cos_w0 = Math.cos(w0);
  const sin_w0 = Math.sin(w0);
  const alpha = sin_w0 / (2 * flt.q);
  const A = Math.pow(10, flt.gain / 40);

  let b0, b1, b2, a0, a1, a2;
  if (flt.type === "peaking") {
    b0 = 1 + alpha * A;
    b1 = -2 * cos_w0;
    b2 = 1 - alpha * A;
    a0 = 1 + alpha / A;
    a1 = -2 * cos_w0;
    a2 = 1 - alpha / A;
  } else if (flt.type === "highshelf") {
    const two_sqrtA_alpha = 2 * Math.sqrt(A) * alpha;
    b0 = A * ((A + 1) + (A - 1) * cos_w0 + two_sqrtA_alpha);
    b1 = -2 * A * ((A - 1) + (A + 1) * cos_w0);
    b2 = A * ((A + 1) + (A - 1) * cos_w0 - two_sqrtA_alpha);
    a0 = (A + 1) - (A - 1) * cos_w0 + two_sqrtA_alpha;
    a1 = 2 * ((A - 1) + (A + 1) * cos_w0);
    a2 = (A + 1) - (A - 1) * cos_w0 - two_sqrtA_alpha;
  } else {
    return { re: 1, im: 0, phase: 0 };
  }

  const w = 2 * Math.PI * f / sr;
  const z1_re = Math.cos(-w), z1_im = Math.sin(-w);
  const z2_re = Math.cos(-2 * w), z2_im = Math.sin(-2 * w);

  const num_re = (b0/a0) + (b1/a0) * z1_re + (b2/a0) * z2_re;
  const num_im = (b1/a0) * z1_im + (b2/a0) * z2_im;
  const den_re = 1 + (a1/a0) * z1_re + (a2/a0) * z2_re;
  const den_im = (a1/a0) * z1_im + (a2/a0) * z2_im;

  const den_mag2 = den_re * den_re + den_im * den_im;
  const h_re = (num_re * den_re + num_im * den_im) / den_mag2;
  const h_im = (num_im * den_re - num_re * den_im) / den_mag2;

  return { re: h_re, im: h_im, phase: Math.atan2(h_im, h_re) };
}

function evalChain(f) {
  let tot_re = 1, tot_im = 0, tot_delay = 0;
  for (let flt of nodes) {
    const h = evalBiquad(flt, f);
    const new_re = tot_re * h.re - tot_im * h.im;
    const new_im = tot_re * h.im + tot_im * h.re;
    tot_re = new_re; tot_im = new_im;

    const df = 0.5;
    const p1 = evalBiquad(flt, Math.max(1, f - df)).phase;
    let p2 = evalBiquad(flt, f + df).phase;
    while (p2 - p1 > Math.PI) p2 -= 2 * Math.PI;
    while (p2 - p1 < -Math.PI) p2 += 2 * Math.PI;
    tot_delay += (-(p2 - p1) / (2 * Math.PI * 2 * df)) * 1000;
  }
  const mag_db = 20 * Math.log10(Math.max(1e-4, Math.hypot(tot_re, tot_im)));
  const phase_deg = Math.atan2(tot_im, tot_re) * (180 / Math.PI);
  return { mag_db, phase_deg, delay_ms: tot_delay };
}

// Logaritmikus koordináták
const MIN_F = 20, MAX_F = 20000;
const LOG_MIN = Math.log10(MIN_F), LOG_MAX = Math.log10(MAX_F);

function getX(f, plotW, padLeft) {
  return padLeft + ((Math.log10(f) - LOG_MIN) / (LOG_MAX - LOG_MIN)) * plotW;
}
function getFreq(x, plotW, padLeft) {
  const norm = Math.max(0, Math.min(plotW, x - padLeft));
  return Math.pow(10, LOG_MIN + (norm / plotW) * (LOG_MAX - LOG_MIN));
}

// Fő rajzolás
function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.width;
  const h = canvas.height;

  ctx.clearRect(0, 0, w, h);

  const padLeft = 46 * dpr;
  const padRight = 50 * dpr;
  const padTop = 18 * dpr;
  const padBottom = 26 * dpr;
  const plotW = w - padLeft - padRight;
  const plotH = h - padTop - padBottom;
  const midY = padTop + plotH * 0.5;

  // 1. EasyEffects Adwaita Rácsháló
  ctx.strokeStyle = "#282828";
  ctx.lineWidth = 1 * dpr;

  const gridFreqs = [30, 50, 100, 200, 500, 1000, 2000, 5000, 10000];
  ctx.fillStyle = "#77767b";
  ctx.font = (10 * dpr) + "px sans-serif";
  ctx.textAlign = "center";

  for (let gf of gridFreqs) {
    const x = getX(gf, plotW, padLeft);
    ctx.beginPath();
    ctx.moveTo(x, padTop); ctx.lineTo(x, padTop + plotH);
    ctx.stroke();
    ctx.fillText((gf >= 1000 ? (gf/1000) + "k" : gf), x, padTop + plotH + 15 * dpr);
  }

  // Vízszintes szintek
  const levels = [
    { db: 18, delay: 10, deg: 180 },
    { db: 12, delay: 6.6, deg: 120 },
    { db: 6,  delay: 3.3, deg: 60 },
    { db: 0,  delay: 0, deg: 0 },
    { db: -6, delay: -3.3, deg: -60 },
    { db: -12, delay: -6.6, deg: -120 },
    { db: -18, delay: -10, deg: -180 }
  ];

  ctx.textAlign = "right";
  for (let lvl of levels) {
    const y = midY - (lvl.db / 24.0) * (plotH * 0.45);
    ctx.strokeStyle = (lvl.db === 0) ? "#454545" : "#282828";
    ctx.lineWidth = (lvl.db === 0) ? 1.5 * dpr : 1 * dpr;
    ctx.beginPath();
    ctx.moveTo(padLeft, y); ctx.lineTo(padLeft + plotW, y);
    ctx.stroke();

    ctx.fillStyle = (lvl.db === 0) ? "#ffffff" : "#77767b";
    ctx.fillText((lvl.db > 0 ? "+" : "") + lvl.db + " dB", padLeft - 6 * dpr, y + 3 * dpr);

    if (showDelay) {
      ctx.textAlign = "left";
      ctx.fillStyle = "#ff7800";
      ctx.fillText((lvl.delay > 0 ? "+" : "") + lvl.delay.toFixed(1) + " ms", padLeft + plotW + 6 * dpr, y + 3 * dpr);
      ctx.textAlign = "right";
    }
  }

  // Pontok számítása
  const points = [];
  for (let px = padLeft; px <= padLeft + plotW; px += 2 * dpr) {
    const f = getFreq(px, plotW, padLeft);
    points.push({ x: px, f, ...evalChain(f) });
  }

  // 2. FÁZISSZÖG GÖRBE (EasyEffects Zöld #33d17a szaggatott)
  if (showPhase) {
    ctx.strokeStyle = "rgba(51, 209, 122, 0.75)";
    ctx.lineWidth = 1.5 * dpr;
    ctx.setLineDash([4 * dpr, 3 * dpr]);
    ctx.beginPath();
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      const y = midY - (p.phase_deg / 180.0) * (plotH * 0.45);
      if (i === 0) ctx.moveTo(p.x, y); else ctx.lineTo(p.x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // 3. CSOPORTKÉSLELTETÉS GÖRBE (EasyEffects Narancs #ff7800)
  if (showDelay) {
    ctx.strokeStyle = "#ff7800";
    ctx.lineWidth = 2.0 * dpr;
    ctx.beginPath();
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      const y = midY - (p.delay_ms / 10.0) * (plotH * 0.45);
      if (i === 0) ctx.moveTo(p.x, y); else ctx.lineTo(p.x, y);
    }
    ctx.stroke();
  }

  // 4. EQ AMPLITÚDÓ GÖRBE (EasyEffects Natív Kék #78aeed)
  if (showCurve) {
    ctx.strokeStyle = "#78aeed";
    ctx.lineWidth = 2.4 * dpr;
    ctx.beginPath();
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      const y = midY - (p.mag_db / 24.0) * (plotH * 0.45);
      if (i === 0) ctx.moveTo(p.x, y); else ctx.lineTo(p.x, y);
    }
    ctx.stroke();
  }

  // 5. KÖZVETLENÜL HÚZHATÓ ADWAITA PONTOK
  nodes.forEach((node, index) => {
    const nx = getX(node.freq, plotW, padLeft);
    const ny = midY - (node.gain / 24.0) * (plotH * 0.45);
    const isSelected = (node.id === selectedNodeId);

    if (isSelected) {
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2 * dpr;
      ctx.beginPath();
      ctx.arc(nx, ny, 10 * dpr, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.fillStyle = node.color;
    ctx.beginPath();
    ctx.arc(nx, ny, 6 * dpr, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold " + (8 * dpr) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(index + 1, nx, ny + 3 * dpr);
  });
}

// Interakciók
function getNodeAt(x, y) {
  const dpr = window.devicePixelRatio || 1;
  const padLeft = 46 * dpr;
  const padRight = 50 * dpr;
  const padTop = 18 * dpr;
  const padBottom = 26 * dpr;
  const plotW = canvas.width - padLeft - padRight;
  const plotH = canvas.height - padTop - padBottom;
  const midY = padTop + plotH * 0.5;

  for (let n of nodes) {
    const nx = getX(n.freq, plotW, padLeft);
    const ny = midY - (n.gain / 24.0) * (plotH * 0.45);
    if (Math.hypot(x - nx, y - ny) < 18 * dpr) return n;
  }
  return null;
}

canvas.onmousedown = (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  const y = (e.clientY - rect.top) * (canvas.height / rect.height);

  const clicked = getNodeAt(x, y);
  if (clicked) {
    draggedNode = clicked;
    selectedNodeId = clicked.id;
    updateUI();
    draw();
  }
};

// DUPLA KATTINTÁSSAL IS LEHET ÚJ PONTOT LÉTREHOZNI A KATTINTÁS HELYÉN!
canvas.ondblclick = (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  const y = (e.clientY - rect.top) * (canvas.height / rect.height);
  const dpr = window.devicePixelRatio || 1;
  const padLeft = 46 * dpr;
  const padRight = 50 * dpr;
  const padTop = 18 * dpr;
  const padBottom = 26 * dpr;
  const plotW = canvas.width - padLeft - padRight;
  const plotH = canvas.height - padTop - padBottom;
  const midY = padTop + plotH * 0.5;

  const f = getFreq(x, plotW, padLeft);
  const g = -((y - midY) / (plotH * 0.45)) * 24.0;
  addNewNode(f, g);
};

canvas.onmousemove = (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  const y = (e.clientY - rect.top) * (canvas.height / rect.height);

  const dpr = window.devicePixelRatio || 1;
  const padLeft = 46 * dpr;
  const padRight = 50 * dpr;
  const padTop = 18 * dpr;
  const padBottom = 26 * dpr;
  const plotW = canvas.width - padLeft - padRight;
  const plotH = canvas.height - padTop - padBottom;
  const midY = padTop + plotH * 0.5;

  if (draggedNode) {
    const newFreq = getFreq(x, plotW, padLeft);
    const newGain = -((y - midY) / (plotH * 0.45)) * 24.0;
    draggedNode.freq = Math.max(20, Math.min(20000, newFreq));
    draggedNode.gain = Math.max(-24, Math.min(24, Math.round(newGain * 10) / 10));
    updateUI();
    draw();
  }

  const curF = getFreq(x, plotW, padLeft);
  const res = evalChain(curF);
  document.getElementById("hudFreq").innerText = (curF >= 1000 ? (curF/1000).toFixed(2) + " kHz" : curF.toFixed(0) + " Hz");
  document.getElementById("hudGain").innerText = (res.mag_db >= 0 ? "+" : "") + res.mag_db.toFixed(1) + " dB";
  document.getElementById("hudDelay").innerText = (res.delay_ms >= 0 ? "+" : "") + res.delay_ms.toFixed(2) + " ms";
  document.getElementById("hudPhase").innerText = (res.phase_deg >= 0 ? "+" : "") + res.phase_deg.toFixed(1) + "°";
};

window.onmouseup = () => { draggedNode = null; };

// Q-faktor állítás egérgörgővel
canvas.onwheel = (e) => {
  e.preventDefault();
  const selNode = nodes.find(n => n.id === selectedNodeId);
  if (selNode) {
    const delta = (e.deltaY > 0) ? -0.15 : 0.15;
    selNode.q = Math.max(0.2, Math.min(10.0, Math.round((selNode.q + delta) * 100) / 100));
    updateUI();
    draw();
  }
};

// Új sáv hozzáadása
function addNewNode(freq = 1000, gain = 0) {
  const newId = Date.now();
  const colors = ["#3584e4", "#e01b24", "#ff7800", "#33d17a", "#9141ac", "#f6d32d"];
  const color = colors[nodes.length % colors.length];
  nodes.push({
    id: newId,
    freq: Math.round(freq),
    gain: Math.round(gain * 10) / 10,
    q: 1.41,
    type: "peaking",
    color: color
  });
  selectedNodeId = newId;
  updateUI();
  draw();
}

document.getElementById("btnAddNode").onclick = () => {
  addNewNode(1000, 0);
};

// Sáv törlése
document.getElementById("btnDeleteNode").onclick = () => {
  if (nodes.length <= 1) return; // Legalább 1 sáv maradjon
  nodes = nodes.filter(n => n.id !== selectedNodeId);
  selectedNodeId = nodes[0].id;
  updateUI();
  draw();
};

function updateUI() {
  const sel = nodes.find(n => n.id === selectedNodeId);
  if (sel) {
    document.getElementById("selectedNodeTitle").innerText = `Sáv #${nodes.indexOf(sel) + 1}`;
    document.getElementById("selectedNodeTitle").style.color = sel.color;

    // Szűrőtípus beállítása a menüben
    if (document.getElementById("selectType")) {
      document.getElementById("selectType").value = sel.type;
    }
    
    // Csak akkor írjuk felül az input értékét, ha nem épp abba gépel a felhasználó!
    if (document.activeElement !== inputFreq) {
      inputFreq.value = Math.round(sel.freq);
    }
    if (document.activeElement !== inputGain) {
      inputGain.value = sel.gain.toFixed(1);
    }
    if (document.activeElement !== inputQ) {
      inputQ.value = sel.q.toFixed(2);
    }
  }
}

// KÉTIRÁNYÚ SZINKRONIZÁCIÓ: Ha kézzel beírsz egy értéket, a pötty azonnal a helyére ugrik!
const selectType = document.getElementById("selectType");
const inputFreq = document.getElementById("inputFreq");
const inputGain = document.getElementById("inputGain");
const inputQ = document.getElementById("inputQ");

selectType.onchange = () => {
  const sel = nodes.find(n => n.id === selectedNodeId);
  if (sel) {
    sel.type = selectType.value;
    draw();
  }
};

inputFreq.oninput = () => {
  const sel = nodes.find(n => n.id === selectedNodeId);
  if (sel && inputFreq.value) {
    const val = parseFloat(inputFreq.value);
    if (!isNaN(val)) {
      sel.freq = Math.max(20, Math.min(20000, val));
      draw();
    }
  }
};

inputGain.oninput = () => {
  const sel = nodes.find(n => n.id === selectedNodeId);
  if (sel && inputGain.value) {
    const val = parseFloat(inputGain.value);
    if (!isNaN(val)) {
      sel.gain = Math.max(-24, Math.min(24, val));
      draw();
    }
  }
};

inputQ.oninput = () => {
  const sel = nodes.find(n => n.id === selectedNodeId);
  if (sel && inputQ.value) {
    const val = parseFloat(inputQ.value);
    if (!isNaN(val)) {
      sel.q = Math.max(0.1, Math.min(15.0, val));
      draw();
    }
  }
};

// Kapcsológombok
const btnCurve = document.getElementById("btnCurve");
const btnDelay = document.getElementById("btnDelay");
const btnPhase = document.getElementById("btnPhase");

btnCurve.onclick = () => {
  showCurve = !showCurve;
  btnCurve.classList.toggle("active-curve", showCurve);
  draw();
};
btnDelay.onclick = () => {
  showDelay = !showDelay;
  btnDelay.classList.toggle("active-delay", showDelay);
  draw();
};
btnPhase.onclick = () => {
  showPhase = !showPhase;
  btnPhase.classList.toggle("active-phase", showPhase);
  draw();
};

updateUI();
setTimeout(resize, 50);
</script>
</body>
</html>
