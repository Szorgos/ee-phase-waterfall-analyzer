# Kiadás: GitHub-on egy Release közzétételekor (vagy "v*" címke feltöltésekor) lefordítja a Windows
# telepítőt, és a Release-hez csatolja. Kézzel is indítható (Actions → Release → Run workflow):
# ilyenkor csak letölthető munkatermék (artifact) készül.
name: Release

on:
  push:
    tags: [ "v*" ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: "Verzió kiadáshoz (pl. 1.3.0). Üresen hagyva csak letölthető munkatermék készül."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Linux: fordítási ellenőrzés (motor + saját ablakos felület + tesztek) és a telepítő csomag (forrás + install.sh)
  linux-package:
    runs-on: ubuntu-24.04
    outputs:
      file: ${{ steps.pkg.outputs.file }}
    steps:
      - uses: actions/checkout@v4

      - name: Függőségek
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libpipewire-0.3-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Fordítás (motor, felület, tesztek)
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PIPEWIRE_PLUGIN=ON -DBUILD_LINUX_GUI=ON
          cmake --build build -j"$(nproc)"
          test -x build/aqulify-engine
          test -x build/aqulify-gui
          for t in test_math test_pipeline test_ringbuffer test_core test_dsp; do ./build/$t; done

      - name: Linux telepítő csomag
        id: pkg
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then VER="${{ inputs.version }}"
          else VER="dev-${GITHUB_SHA::7}"; fi
          NAME="Aqulify-Linux-${VER}"
          git archive --format=tar.gz --prefix="${NAME}/" -o "${NAME}.tar.gz" HEAD
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          echo "file=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Aqulify-Linux
          path: |
            ${{ steps.pkg.outputs.file }}
            ${{ steps.pkg.outputs.file }}.sha256

  windows-installer:
    needs: linux-package
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW: llvm-mingw-20250924-ucrt-ubuntu-22.04-x86_64
      # Kódaláírás (SignPath Foundation): csak ha a SIGNPATH_API_TOKEN titok be van állítva (docs/code-signing.md)
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: llvm-mingw letöltése (Linuxról Windowsra fordító)
        run: |
          curl -sSL -o /tmp/llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20250924/${LLVM_MINGW}.tar.xz
          sudo tar -xf /tmp/llvm-mingw.tar.xz -C /opt
          sudo ln -s /opt/${LLVM_MINGW} /opt/llvm-mingw
          sudo apt-get install -y ninja-build

      - name: Fordítás
        run: |
          cmake -B build-win -S . -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=windows/toolchain-llvm-mingw.cmake -DLLVM_MINGW_ROOT=/opt/llvm-mingw
          cmake --build build-win -j"$(nproc)"

      - name: Közös DSP tesztek (Linux)
        run: |
          cmake -B build-test -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PIPEWIRE_PLUGIN=OFF
          cmake --build build-test -j"$(nproc)"
          fail=0
          for t in test_math test_pipeline test_ringbuffer test_core test_dsp; do
            echo "::group::$t"
            if ./build-test/$t; then echo "$t: OK"; else echo "::error::$t sikertelen"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail

      # ---------------------------------------------------------------- kódaláírás (SignPath)
      # 1. kör: a motor, a felület és az Equalizer APO plugin aláírása
      - name: Aláíratlan programfájlok feltöltése (aláíráshoz)
        if: env.SIGNPATH_ENABLED == 'true'
        id: upload-binaries
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-binaries
          path: |
            build-win/Aqulify.exe
            build-win/AqulifyGui.exe
            build-win/Aqulify.dll

      - name: Programfájlok aláírása (SignPath)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'aqulify' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.upload-binaries.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-binaries

      # 2. kör: a telepítő újraépítése az aláírt fájlokkal, majd a telepítő aláírása
      - name: Telepítő újraépítése az aláírt fájlokkal
        if: env.SIGNPATH_ENABLED == 'true'
        run: |
          cmake -B build-win -S . -DEE_SIGNED_BINARIES_DIR="$PWD/signed-binaries"
          cmake --build build-win --target AqulifySetup

      - name: Aláíratlan telepítő feltöltése (aláíráshoz)
        if: env.SIGNPATH_ENABLED == 'true'
        id: upload-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: build-win/Aqulify-Setup.exe

      - name: Telepítő aláírása (SignPath)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'aqulify' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Aláírt telepítő átvétele
        if: env.SIGNPATH_ENABLED == 'true'
        run: cp signed-setup/Aqulify-Setup.exe build-win/Aqulify-Setup.exe

      - name: Telepítő elnevezése
        id: name
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then VER="${{ inputs.version }}"
          else VER="dev-${GITHUB_SHA::7}"; fi
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          cp build-win/Aqulify-Setup.exe "Aqulify-Setup-${VER}.exe"
          sha256sum "Aqulify-Setup-${VER}.exe" > "Aqulify-Setup-${VER}.exe.sha256"
          # Állandó nevű példány: a README "legújabb kiadás" letöltési linkje erre mutat
          cp build-win/Aqulify-Setup.exe Aqulify-Setup.exe
          echo "file=Aqulify-Setup-${VER}.exe" >> "$GITHUB_OUTPUT"

      - name: Feltöltés munkatermékként
        uses: actions/upload-artifact@v4
        with:
          name: Aqulify-Windows
          path: |
            ${{ steps.name.outputs.file }}
            ${{ steps.name.outputs.file }}.sha256

      - name: Linux csomag átvétele a kiadáshoz
        uses: actions/download-artifact@v4
        with:
          name: Aqulify-Linux

      - name: "GitHub Release (kézi indításkor verziószámmal: új címke és kiadás)"
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Aqulify ${{ inputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.name.outputs.file }}
            ${{ steps.name.outputs.file }}.sha256
            Aqulify-Setup.exe
            ${{ needs.linux-package.outputs.file }}
            ${{ needs.linux-package.outputs.file }}.sha256

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Aqulify ${{ github.ref_name }}
          body_path: ${{ github.event_name == 'push' && 'RELEASE_NOTES.md' || '' }}
          files: |
            ${{ steps.name.outputs.file }}
            ${{ steps.name.outputs.file }}.sha256
            Aqulify-Setup.exe
            ${{ needs.linux-package.outputs.file }}
            ${{ needs.linux-package.outputs.file }}.sha256
