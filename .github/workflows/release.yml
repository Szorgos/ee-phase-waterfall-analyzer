# Kiadás: GitHub-on egy Release közzétételekor (vagy "v*" címke feltöltésekor) lefordítja a Windows
# telepítőt, és a Release-hez csatolja. Kézzel is indítható (Actions → Release → Run workflow):
# ilyenkor csak letölthető munkatermék (artifact) készül.
name: Release

on:
  push:
    tags: [ "v*" ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: "Verzió kiadáshoz (pl. 1.3.0). Üresen hagyva csak letölthető munkatermék készül."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Linux: fordítási ellenőrzés (motor + saját ablakos felület + tesztek) és a telepítő csomag (forrás + install.sh)
  linux-package:
    runs-on: ubuntu-24.04
    outputs:
      file: ${{ steps.pkg.outputs.file }}
    steps:
      - uses: actions/checkout@v4

      - name: Függőségek
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libpipewire-0.3-dev libfftw3-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Fordítások ellenőrzése (i18n/ és az előállított fájlok egyeznek)
        run: python3 tools/i18n_build.py --check

      - name: RNNoise modell (az Ubuntu forráscsomagjából, a tárolóban nincs)
        run: |
          for i in 1 2 3; do curl -fsSL -o /tmp/rnnoise.tar.xz http://archive.ubuntu.com/ubuntu/pool/universe/r/rnnoise/rnnoise_0.2+ds.orig.tar.xz && break; sleep 15; done
          got=$(sha256sum /tmp/rnnoise.tar.xz | cut -d' ' -f1)
          want=db2718ee4a0b294bfbbe198fe94aabfdc8cd0d77cb9cd95d76c7a818ad805f0b
          if [ "$got" != "$want" ]; then echo "::error title=RNNoise::sha256 eltérés: $got"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/rnnoise-model"
          tar -xJf /tmp/rnnoise.tar.xz -C "$RUNNER_TEMP/rnnoise-model" --strip-components=2 rnnoise-0.2/src/rnnoise_data.c rnnoise-0.2/src/rnnoise_data.h

      - name: Fordítás (motor, felület, tesztek)
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PIPEWIRE_PLUGIN=ON -DBUILD_LINUX_GUI=ON \
            -DAQULIFY_RNNOISE_MODEL_DIR="$RUNNER_TEMP/rnnoise-model"
          cmake --build build -j"$(nproc)"
          test -x build/aqulify-engine
          test -x build/aqulify-gui
          for t in test_ringbuffer test_core test_dsp test_matrix; do ./build/$t; done

      - name: Linux telepítő csomag
        id: pkg
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then VER="${{ inputs.version }}"
          else VER="dev-${GITHUB_SHA::7}"; fi
          NAME="Aqulify-Linux-${VER}"
          git archive --format=tar.gz --prefix="${NAME}/" -o "${NAME}.tar.gz" HEAD
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          echo "file=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Aqulify-Linux
          path: |
            ${{ steps.pkg.outputs.file }}
            ${{ steps.pkg.outputs.file }}.sha256

  # Fedora RPM (ugyanaz a spec és SRPM-készítés, amit a COPR használ): ellenőrzi a csomagolást, és a kiadáshoz csatolja
  fedora-rpm:
    runs-on: ubuntu-24.04
    container: fedora:latest
    outputs:
      file: ${{ steps.rpm.outputs.file }}
    steps:
      - name: Eszközök
        run: for i in 1 2 3; do dnf -y install git make rpm-build dnf-plugins-core && break; sleep 20; done
      - uses: actions/checkout@v4
      - name: SRPM és RPM építése
        id: rpm
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Hiba esetén a napló vége hibajelzésként (annotáció) is megjelenik
          fail() { msg=$(tail -n 40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::error title=Fedora RPM build::${msg}"; exit 1; }
          { make -f .copr/Makefile srpm outdir="$PWD/srpm" && { for i in 1 2 3; do dnf -y --refresh builddep srpm/*.src.rpm && break; [ $i = 3 ] && exit 1; sleep 20; done; } && \
            rpmbuild --rebuild --define "_rpmdir $PWD/rpm" srpm/*.src.rpm; } > build.log 2>&1 || fail
          tail -n 15 build.log
          f=$(ls rpm/x86_64/aqulify-[0-9]*.x86_64.rpm | head -1)
          cp "$f" . && sha256sum "$(basename "$f")" > "$(basename "$f").sha256"
          echo "file=$(basename "$f")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Aqulify-Fedora
          path: |
            ${{ steps.rpm.outputs.file }}
            ${{ steps.rpm.outputs.file }}.sha256

  windows-installer:
    needs: [linux-package, fedora-rpm]
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW: llvm-mingw-20250924-ucrt-ubuntu-22.04-x86_64
      # Kódaláírás (SignPath Foundation): csak ha a SIGNPATH_API_TOKEN titok be van állítva (docs/code-signing.md)
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: llvm-mingw letöltése (Linuxról Windowsra fordító)
        run: |
          curl -sSL -o /tmp/llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20250924/${LLVM_MINGW}.tar.xz
          sudo tar -xf /tmp/llvm-mingw.tar.xz -C /opt
          sudo ln -s /opt/${LLVM_MINGW} /opt/llvm-mingw
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libfftw3-dev

      - name: FFTW 3.3.10 forrás (a Windows binárisokba statikusan épül)
        run: |
          for i in 1 2 3; do curl -fsSL -o /tmp/fftw.tar.gz https://www.fftw.org/fftw-3.3.10.tar.gz && break; sleep 15; done
          got=$(sha256sum /tmp/fftw.tar.gz | cut -d' ' -f1)
          want=56c932549852cddcfafdab3820b0200c7742675be92179e59e6215b340e26467
          if [ "$got" != "$want" ]; then echo "::error title=FFTW::sha256 eltérés: $got"; exit 1; fi
          tar -xzf /tmp/fftw.tar.gz -C "$RUNNER_TEMP"

      - name: RNNoise modell (az Ubuntu forráscsomagjából, a tárolóban nincs)
        run: |
          for i in 1 2 3; do curl -fsSL -o /tmp/rnnoise.tar.xz http://archive.ubuntu.com/ubuntu/pool/universe/r/rnnoise/rnnoise_0.2+ds.orig.tar.xz && break; sleep 15; done
          got=$(sha256sum /tmp/rnnoise.tar.xz | cut -d' ' -f1)
          want=db2718ee4a0b294bfbbe198fe94aabfdc8cd0d77cb9cd95d76c7a818ad805f0b
          if [ "$got" != "$want" ]; then echo "::error title=RNNoise::sha256 eltérés: $got"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/rnnoise-model"
          tar -xJf /tmp/rnnoise.tar.xz -C "$RUNNER_TEMP/rnnoise-model" --strip-components=2 rnnoise-0.2/src/rnnoise_data.c rnnoise-0.2/src/rnnoise_data.h

      - name: Fordítás
        run: |
          cmake -B build-win -S . -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=windows/toolchain-llvm-mingw.cmake -DLLVM_MINGW_ROOT=/opt/llvm-mingw \
            -DAQULIFY_FFTW_SOURCE_DIR="$RUNNER_TEMP/fftw-3.3.10" -DAQULIFY_RNNOISE_MODEL_DIR="$RUNNER_TEMP/rnnoise-model"
          cmake --build build-win -j"$(nproc)" > build-win.log 2>&1 || {
            msg=$(grep -E "error|Error" build-win.log | tail -n 30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Windows build::${msg}"; exit 1; }

      - name: Közös DSP tesztek (Linux)
        run: |
          cmake -B build-test -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PIPEWIRE_PLUGIN=OFF \
            -DAQULIFY_RNNOISE_MODEL_DIR="$RUNNER_TEMP/rnnoise-model"
          cmake --build build-test -j"$(nproc)"
          fail=0
          for t in test_ringbuffer test_core test_dsp test_matrix; do
            echo "::group::$t"
            if ./build-test/$t; then echo "$t: OK"; else echo "::error::$t sikertelen"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail

      # ---------------------------------------------------------------- kódaláírás (SignPath)
      # 1. kör: a motor, a felület és az Equalizer APO plugin aláírása
      - name: Aláíratlan programfájlok feltöltése (aláíráshoz)
        if: env.SIGNPATH_ENABLED == 'true'
        id: upload-binaries
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-binaries
          path: |
            build-win/Aqulify.exe
            build-win/AqulifyGui.exe
            build-win/Aqulify.dll

      - name: Programfájlok aláírása (SignPath)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'aqulify' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.upload-binaries.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-binaries

      # 2. kör: a telepítő újraépítése az aláírt fájlokkal, majd a telepítő aláírása
      - name: Telepítő újraépítése az aláírt fájlokkal
        if: env.SIGNPATH_ENABLED == 'true'
        run: |
          cmake -B build-win -S . -DEE_SIGNED_BINARIES_DIR="$PWD/signed-binaries"
          cmake --build build-win --target AqulifySetup

      - name: Aláíratlan telepítő feltöltése (aláíráshoz)
        if: env.SIGNPATH_ENABLED == 'true'
        id: upload-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: build-win/Aqulify-Setup.exe

      - name: Telepítő aláírása (SignPath)
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'aqulify' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Aláírt telepítő átvétele
        if: env.SIGNPATH_ENABLED == 'true'
        run: cp signed-setup/Aqulify-Setup.exe build-win/Aqulify-Setup.exe

      - name: Telepítő elnevezése
        id: name
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then VER="${{ inputs.version }}"
          else VER="dev-${GITHUB_SHA::7}"; fi
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          cp build-win/Aqulify-Setup.exe "Aqulify-Setup-${VER}.exe"
          sha256sum "Aqulify-Setup-${VER}.exe" > "Aqulify-Setup-${VER}.exe.sha256"
          # Állandó nevű példány: a README "legújabb kiadás" letöltési linkje erre mutat
          cp build-win/Aqulify-Setup.exe Aqulify-Setup.exe
          echo "file=Aqulify-Setup-${VER}.exe" >> "$GITHUB_OUTPUT"

      - name: Feltöltés munkatermékként
        uses: actions/upload-artifact@v4
        with:
          name: Aqulify-Windows
          path: |
            ${{ steps.name.outputs.file }}
            ${{ steps.name.outputs.file }}.sha256

      - name: Linux csomag átvétele a kiadáshoz
        uses: actions/download-artifact@v4
        with:
          name: Aqulify-Linux

      - name: Fedora RPM átvétele a kiadáshoz
        uses: actions/download-artifact@v4
        with:
          name: Aqulify-Fedora

      - name: "GitHub Release (kézi indításkor verziószámmal: új címke és kiadás)"
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Aqulify ${{ inputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.name.outputs.file }}
            ${{ steps.name.outputs.file }}.sha256
            Aqulify-Setup.exe
            ${{ needs.linux-package.outputs.file }}
            ${{ needs.linux-package.outputs.file }}.sha256
            ${{ needs.fedora-rpm.outputs.file }}
            ${{ needs.fedora-rpm.outputs.file }}.sha256

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Aqulify ${{ github.ref_name }}
          body_path: ${{ github.event_name == 'push' && 'RELEASE_NOTES.md' || '' }}
          files: |
            ${{ steps.name.outputs.file }}
            ${{ steps.name.outputs.file }}.sha256
            Aqulify-Setup.exe
            ${{ needs.linux-package.outputs.file }}
            ${{ needs.linux-package.outputs.file }}.sha256
            ${{ needs.fedora-rpm.outputs.file }}
            ${{ needs.fedora-rpm.outputs.file }}.sha256

  # macOS: Aqulify.app univerzális DMG-ben (a macos.yml munkafolyamat)
  macos-app:
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ inputs.version }}

  # A macOS DMG a kiadáshoz; külön feladat, így a macOS fordítás nem tartja vissza a Windows és Linux kiadást
  macos-release:
    needs: [macos-app, windows-installer]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-24.04
    steps:
      - name: macOS DMG átvétele
        uses: actions/download-artifact@v4
        with:
          name: Aqulify-macOS

      - name: Feltöltés a kiadáshoz
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          files: |
            ${{ needs.macos-app.outputs.file }}
            ${{ needs.macos-app.outputs.file }}.sha256
            Aqulify-macOS.dmg

  # Fedora COPR (nlali/aqulify): kiadáskor újraépíti a csomagot, így a dnf / Discover frissítést kap.
  # A COPR "custom webhook" címében lévő UUID titkos kulcs, ezért a teljes cím GitHub Secretben van:
  # Settings → Secrets and variables → Actions → COPR_WEBHOOK_URL
  # (COPR: Settings → Integrations → Custom webhook, a végére a csomag neve: .../aqulify/).
  copr-rebuild:
    needs: windows-installer
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-24.04
    steps:
      - name: COPR újraépítés indítása
        env:
          COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
        run: |
          if [ -z "$COPR_WEBHOOK_URL" ]; then
            echo "::warning::Nincs beállítva a COPR_WEBHOOK_URL titok, a COPR újraépítés kimarad; kézzel: copr.fedorainfracloud.org/coprs/nlali/aqulify → Packages → Rebuild"
            exit 0
          fi
          for i in 1 2 3; do
            curl -fsS -o /dev/null -X POST "$COPR_WEBHOOK_URL" && exit 0
            sleep 30
          done
          echo "::warning::A COPR újraépítést nem sikerült elindítani; kézzel: copr.fedorainfracloud.org/coprs/nlali/aqulify → Packages → Rebuild"
