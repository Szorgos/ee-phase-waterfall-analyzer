name: Windows tesztek

# Natív Windows-os fordítás és a közös tesztek futtatása (llvm-mingw, ugyanaz a toolchain, mint a kiadásnál).
# Csak kézzel indul (workflow_dispatch): kiadást és publikálást nem végez.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      LLVM_MINGW_DIR: llvm-mingw-20250924-ucrt-x86_64
    steps:
      - uses: actions/checkout@v4

      # A Git Bash a Windows-os útvonalakat (D:\a\_temp) nem kezeli jól: a shellhez POSIX (/d/a/_temp),
      # a CMake-hez vegyes (D:/a/_temp) útvonalat készítünk.
      - name: Útvonalak
        shell: bash
        run: |
          echo "TEMP_POSIX=$(cygpath -u "$RUNNER_TEMP")" >> "$GITHUB_ENV"
          echo "TEMP_MIXED=$(cygpath -m "$RUNNER_TEMP")" >> "$GITHUB_ENV"

      - name: llvm-mingw letöltése (Windows-os változat)
        shell: bash
        run: |
          curl -sSL -o "$TEMP_POSIX/llvm-mingw.zip" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20250924/${LLVM_MINGW_DIR}.zip"
          unzip -q "$TEMP_POSIX/llvm-mingw.zip" -d "$TEMP_POSIX"
          echo "LLVM_MINGW_ROOT=$TEMP_MIXED/${LLVM_MINGW_DIR}" >> "$GITHUB_ENV"
          echo "$TEMP_POSIX/${LLVM_MINGW_DIR}/bin" >> "$GITHUB_PATH"

      - name: Ninja
        shell: bash
        run: python -m pip install --quiet ninja

      # A sha256sum a stdin-ről olvas (a fájlnévvel a Windows-os útvonal visszaperjelet tenne a hash elé)
      - name: FFTW 3.3.10 forrás (ellenőrzött)
        shell: bash
        run: |
          for i in 1 2 3; do curl -fsSL -o "$TEMP_POSIX/fftw.tar.gz" https://www.fftw.org/fftw-3.3.10.tar.gz && break; sleep 15; done
          got=$(sha256sum < "$TEMP_POSIX/fftw.tar.gz" | cut -d' ' -f1)
          want=56c932549852cddcfafdab3820b0200c7742675be92179e59e6215b340e26467
          if [ "$got" != "$want" ]; then echo "::error title=FFTW::sha256 eltérés: $got"; exit 1; fi
          tar -xzf "$TEMP_POSIX/fftw.tar.gz" -C "$TEMP_POSIX"
          echo "FFTW_DIR=$TEMP_MIXED/fftw-3.3.10" >> "$GITHUB_ENV"

      - name: RNNoise modell (az Ubuntu forráscsomagjából)
        shell: bash
        run: |
          for i in 1 2 3; do curl -fsSL -o "$TEMP_POSIX/rnnoise.tar.xz" http://archive.ubuntu.com/ubuntu/pool/universe/r/rnnoise/rnnoise_0.2+ds.orig.tar.xz && break; sleep 15; done
          got=$(sha256sum < "$TEMP_POSIX/rnnoise.tar.xz" | cut -d' ' -f1)
          want=db2718ee4a0b294bfbbe198fe94aabfdc8cd0d77cb9cd95d76c7a818ad805f0b
          if [ "$got" != "$want" ]; then echo "::error title=RNNoise::sha256 eltérés: $got"; exit 1; fi
          mkdir -p "$TEMP_POSIX/rnnoise-model"
          tar -xJf "$TEMP_POSIX/rnnoise.tar.xz" -C "$TEMP_POSIX/rnnoise-model" --strip-components=2 rnnoise-0.2/src/rnnoise_data.c rnnoise-0.2/src/rnnoise_data.h
          echo "RNNOISE_DIR=$TEMP_MIXED/rnnoise-model" >> "$GITHUB_ENV"

      - name: Fordítás (tesztek, Windows)
        shell: bash
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=windows/toolchain-llvm-mingw.cmake -DLLVM_MINGW_ROOT="$LLVM_MINGW_ROOT" \
            -DAQULIFY_FFTW_SOURCE_DIR="$FFTW_DIR" -DAQULIFY_RNNOISE_MODEL_DIR="$RNNOISE_DIR"
          cmake --build build -j"$(nproc)" --target test_ringbuffer test_core test_dsp test_matrix test_keepawake

      - name: Tesztek futtatása (Windows)
        shell: bash
        run: |
          fail=0
          for t in test_ringbuffer test_core test_dsp test_matrix test_keepawake; do
            echo "::group::$t"
            if ./build/$t.exe; then echo "$t: OK"; else echo "::error::$t sikertelen"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail
