name: Windows tesztek

# Natív Windows-os fordítás és a közös DSP-tesztek futtatása (llvm-mingw, ugyanaz a toolchain, mint a kiadásnál).
# Csak kézzel indul (workflow_dispatch): kiadást és publikálást nem végez.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      LLVM_MINGW_DIR: llvm-mingw-20250924-ucrt-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: llvm-mingw letöltése (Windows-os változat)
        shell: bash
        run: |
          curl -sSL -o "$RUNNER_TEMP/llvm-mingw.zip" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20250924/${LLVM_MINGW_DIR}.zip"
          unzip -q "$RUNNER_TEMP/llvm-mingw.zip" -d "$RUNNER_TEMP"
          echo "LLVM_MINGW_ROOT=$RUNNER_TEMP/${LLVM_MINGW_DIR}" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/${LLVM_MINGW_DIR}/bin" >> "$GITHUB_PATH"

      - name: Ninja
        shell: bash
        run: python -m pip install --quiet ninja

      # A sha256sum a stdin-ről olvas (a Windows-os útvonal visszaperjelet tenne a hash elé); a tar --force-local
      # (a D: meghajtóbetű kettőspontja különben távoli gépnek látszik)
      - name: FFTW 3.3.10 forrás (ellenőrzött)
        shell: bash
        run: |
          for i in 1 2 3; do curl -fsSL -o "$RUNNER_TEMP/fftw.tar.gz" https://www.fftw.org/fftw-3.3.10.tar.gz && break; sleep 15; done
          got=$(sha256sum < "$RUNNER_TEMP/fftw.tar.gz" | cut -d' ' -f1)
          want=56c932549852cddcfafdab3820b0200c7742675be92179e59e6215b340e26467
          if [ "$got" != "$want" ]; then echo "::error title=FFTW::sha256 eltérés: $got"; exit 1; fi
          tar --force-local -xzf "$RUNNER_TEMP/fftw.tar.gz" -C "$RUNNER_TEMP"

      - name: RNNoise modell (az Ubuntu forráscsomagjából)
        shell: bash
        run: |
          for i in 1 2 3; do curl -fsSL -o "$RUNNER_TEMP/rnnoise.tar.xz" http://archive.ubuntu.com/ubuntu/pool/universe/r/rnnoise/rnnoise_0.2+ds.orig.tar.xz && break; sleep 15; done
          got=$(sha256sum < "$RUNNER_TEMP/rnnoise.tar.xz" | cut -d' ' -f1)
          want=db2718ee4a0b294bfbbe198fe94aabfdc8cd0d77cb9cd95d76c7a818ad805f0b
          if [ "$got" != "$want" ]; then echo "::error title=RNNoise::sha256 eltérés: $got"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/rnnoise-model"
          tar --force-local -xJf "$RUNNER_TEMP/rnnoise.tar.xz" -C "$RUNNER_TEMP/rnnoise-model" --strip-components=2 rnnoise-0.2/src/rnnoise_data.c rnnoise-0.2/src/rnnoise_data.h

      - name: Fordítás (tesztek, Windows)
        shell: bash
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=windows/toolchain-llvm-mingw.cmake -DLLVM_MINGW_ROOT="$LLVM_MINGW_ROOT" \
            -DAQULIFY_FFTW_SOURCE_DIR="$RUNNER_TEMP/fftw-3.3.10" -DAQULIFY_RNNOISE_MODEL_DIR="$RUNNER_TEMP/rnnoise-model"
          cmake --build build -j"$(nproc)" --target test_ringbuffer test_core test_dsp test_matrix

      - name: Tesztek futtatása (Windows)
        shell: bash
        run: |
          fail=0
          for t in test_ringbuffer test_core test_dsp test_matrix; do
            echo "::group::$t"
            if ./build/$t.exe; then echo "$t: OK"; else echo "::error::$t sikertelen"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail
