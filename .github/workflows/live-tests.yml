name: Élő tesztek (Linux, PipeWire)

# A motor és a felület élő tesztje valódi PipeWire-gráfon, két virtuális hangkártyával (tests/live):
# több kimenet, a DSP-modulok hangmérése, a felület kezelőszervei (headless Chromium).
on:
  push:
    branches: [ master ]
    paths:
      - "include/**"
      - "src/**"
      - "gui_integrated_system.html"
      - "gui_i18n.js"
      - "tests/live/**"
      - "tools/pi/**"
      - "CMakeLists.txt"
      - ".github/workflows/live-tests.yml"
  workflow_dispatch:

# Csomagletöltés (C1): letöltési hibánál és elakadásnál az apt újrapróbál, rövidebb időkorláttal. A csomaglista ettől
# nem változik; a tools/check_ci_stabilitas.sh ellenőrzi, hogy minden apt-get update/install ezt használja.
env:
  APT_NET: "-o Acquire::Retries=10 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
  AQ_FETCH_MIN_BPS: "102400"   # RNNoise-letöltés: 20 mp-ig 100 kB/s alatt a következő tükör jön
  AQ_FETCH_DEADLINE: "300"     # és legfeljebb 5 perc összesen (tools/fetch_rnnoise.sh)

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Függőségek
        timeout-minutes: 15
        run: |
          sudo apt-get $APT_NET update -q
          sudo apt-get $APT_NET install -y -q build-essential cmake pkg-config libpipewire-0.3-dev libfftw3-dev libsystemd-dev libasound2-dev \
            pipewire wireplumber pipewire-pulse pulseaudio-utils dbus python3-numpy

      - name: RNNoise modell (az Ubuntu forráscsomagjából)
        timeout-minutes: 7
        run: |
          bash tools/fetch_rnnoise.sh /tmp/rnnoise.tar.xz || { echo "::error title=RNNoise::a letöltés egyik tükörről sem sikerült"; exit 1; }
          mkdir -p "$RUNNER_TEMP/rnnoise-model"
          tar -xJf /tmp/rnnoise.tar.xz -C "$RUNNER_TEMP/rnnoise-model" --strip-components=2 rnnoise-0.2/src/rnnoise_data.c rnnoise-0.2/src/rnnoise_data.h

      - name: Fordítás (motor)
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_PIPEWIRE_PLUGIN=ON -DBUILD_LINUX_GUI=OFF \
            -DAQULIFY_RNNOISE_MODEL_DIR="$RUNNER_TEMP/rnnoise-model"
          cmake --build build -j"$(nproc)" --target aqulify-engine test_alsa test_room test_mic_live test_measure_live

      - name: ALSA-kimenet tesztje
        run: ./build/test_alsa

      - name: Szobamérés – mag, mikrofonfelvétel és teljes mérés élőben
        run: |
          ./build/test_room
          bash tests/live/mic_live.sh build
          bash tests/live/measure_live.sh build

      - name: Rendszerhangoló teszt (aqulify-tune)
        run: bash tools/pi/test-aqulify-tune.sh

      - name: Playwright (headless Chromium a felületi tesztekhez)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --silent playwright@1.49.1
          npx playwright install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: Élő tesztek
        run: tests/live/run_all.sh build
